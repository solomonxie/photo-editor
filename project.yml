name: PhotoEditor
options:
  bundleIdPrefix: com.example.photoeditor
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PhotoEditor:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: PhotoEditor
        excludes:
          - "**/README.md"
      # Preset edits for demo mode (Settings → Demo).
      - path: demo
        type: folder
        buildPhase: resources
    info:
      path: PhotoEditor/Info.plist
      properties:
        CFBundleDisplayName: Photo Editor
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        AppNamespace: $(APP_NAMESPACE)
        ITSAppUsesNonExemptEncryption: false
        AppStoreRegion: $(STORE)
        NSPhotoLibraryAddUsageDescription: "Export adds your edited photos to your library as new photos."
        NSPhotoLibraryUsageDescription: "Compress reads only the photos and videos you choose, adds smaller copies, and deletes originals only when you confirm."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        # App Store region (us = Canada/US, cn); `make ios STORE=cn`.
        STORE: us
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  PhotoEditorTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources: [PhotoEditorTests]
    dependencies:
      - target: PhotoEditor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_NAMESPACE).tests
        CODE_SIGN_STYLE: Automatic
schemes:
  PhotoEditor:
    build:
      targets:
        PhotoEditor: all
    test:
      targets: [PhotoEditorTests]
