name: PhotoEditor
options:
  bundleIdPrefix: com.example.photoeditor
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PhotoEditor:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Local.xcconfig
    sources:
      - path: PhotoEditor
        excludes:
          - "**/README.md"
    info:
      path: PhotoEditor/Info.plist
      properties:
        CFBundleDisplayName: Photo Editor
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: "Save your edited photos to your library."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.photoeditor.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  PhotoEditorTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Local.xcconfig
    sources: [PhotoEditorTests]
    dependencies:
      - target: PhotoEditor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        PRODUCT_BUNDLE_IDENTIFIER: com.example.photoeditor.tests
        CODE_SIGN_STYLE: Automatic
schemes:
  PhotoEditor:
    build:
      targets:
        PhotoEditor: all
    test:
      targets: [PhotoEditorTests]
