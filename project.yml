name: PhotoEditor
options:
  bundleIdPrefix: com.solomonxie.photoeditor
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  PhotoEditor:
    type: application
    platform: iOS
    sources:
      - path: PhotoEditor
        excludes:
          - "**/README.md"
    info:
      path: PhotoEditor/Info.plist
      properties:
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: "Pick photos from your library to edit."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.solomonxie.photoeditor.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
